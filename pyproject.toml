[project]
name = "research"
version = "0.1.0"
description = "Research using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai",
    "crewai-tools>=1.14.6",
    "gradio>=6.17.3",
    "groq>=1.4.0",
    "litellm>=1.88.0",
    "pydantic>=2.12.5",
    "python-dotenv",
    "tavily-python>=0.7.25",
]

[project.scripts]
research = "research.main:run"
run_crew = "research.main:run"
train = "research.main:train"
replay = "research.main:replay"
test = "research.main:test"
run_with_trigger = "research.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.crewai]
type = "crew"
model = "groq/llama-3.3-70b-versatile"